name: Diagnose wallet RPC path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Regtest wallet path diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      # Reuse the two private-regtest password secrets from the integration job.
      ZCANARY_ZEBRA_PASSWORD: ${{ secrets.ZCANARY_ZEBRA_PASSWORD }}
      ZCANARY_NODE_USER: zebra
      ZCANARY_NODE_PASSWORD: ${{ secrets.ZCANARY_ZEBRA_PASSWORD }}
      ZCANARY_ZALLET_PASSWORD: ${{ secrets.ZCANARY_ZALLET_PASSWORD }}
      ZCANARY_ZALLET_USER: zebra
      Z3_REGTEST_RPC_ROUTER_USER: zebra
      Z3_REGTEST_RPC_ROUTER_PASSWORD: ${{ secrets.ZCANARY_ZALLET_PASSWORD }}
      Z3_ZALLET_RUST_LOG: debug
      ZCANARY_ROUTER_LOG_INFO: "1"
      # Keep this manual diagnostic run short; the normal CI wait remains six minutes.
      WALLET_RPC_WAIT_BUDGET: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify Docker availability
        run: docker compose version && docker info
      - name: Prepare disposable Regtest stack
        shell: bash
        run: |
          echo "ZCANARY_DIAG_PREPARE_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          bash scripts/prepare-regtest.sh
      - name: Run wallet path probes after prepare
        if: always()
        shell: bash
        run: |
          mkdir -p out/diagnostics
          elapsed=0
          if [[ "${ZCANARY_DIAG_PREPARE_STARTED_EPOCH:-}" =~ ^[0-9]+$ ]]; then
            elapsed=$(( $(date +%s) - ZCANARY_DIAG_PREPARE_STARTED_EPOCH ))
          fi
          ZCANARY_DIAGNOSTIC_BATCH=post-prepare \
          ZCANARY_DIAGNOSTIC_ELAPSED_S="$elapsed" \
            bash scripts/diagnose-wallet-path.sh
      - name: Upload wallet path diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zcanary-wallet-path-diagnostics
          path: out/diagnostics
          if-no-files-found: warn
          retention-days: 14
