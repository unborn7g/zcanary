[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zcanary"
version = "0.0.1"
description = "Privacy smoke test for Zcash apps on a disposable regtest"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zcanary = "zcanary.cli:main"

[tool.setuptools.packages.find]
include = ["zcanary*"]
